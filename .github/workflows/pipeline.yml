name: Run Capstone Pipeline

on:
  push:
    branches: 
      - '**' # Matches any branch name
  pull_request:
    branches: 
      - '**' # Matches PRs targeting any branch

jobs:
  build-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository with LFS data
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install Playwright browsers  # <--- Add this step
      run: playwright install --with-deps

    - name: Run Full Pipeline
      run: |
        python main.py

    - name: Upload Pipeline Artifacts (Data & Reports)
      uses: actions/upload-artifact@v4
      with:
        name: capstone-pipeline-outputs
        path: |
          data/processed/master_dataset_all_variables.csv
          data/final/x_test.csv
          data/final/x_train.csv
          data/final/y_test.csv
          data/final/y_train.csv
          eda_summary_report.html
          eda_summary_reprot.pdf
        retention-days: 2 # Keeps storage clear during active development and testing of the pipeline. Adjust as needed for longer retention.