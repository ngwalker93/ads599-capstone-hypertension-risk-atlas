name: Run Capstone Pipeline

on:
  push:
    branches: 
      - '**' # Matches any branch name
  pull_request:
    branches: 
      - '**' # Matches PRs targeting any branch

jobs:
  build-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps

    - name: Run Full Pipeline
      run: |
        python main.py

    - name: Upload Pipeline Artifacts (Data & Reports)
      uses: actions/upload-artifact@v4
      with:
        name: capstone-pipeline-outputs
        path: |
          data/processed/
          data/final/
        retention-days: 30